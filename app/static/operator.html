<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acme — Operador</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f3f5; color: #1a1a1a; }
  header { background: #1a1a2e; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  header .header-right { display: flex; align-items: center; gap: 14px; }
  #operator-id { padding: 5px 9px; border: 1px solid #444a78; border-radius: 6px; background: #26264a; color: #fff; font-size: 13px; width: 150px; }
  header a { color: #cfd3ff; font-size: 13px; font-weight: 400; text-decoration: none; cursor: pointer; }
  header a:hover { text-decoration: underline; }
  /* --- key gate --- */
  #gate { max-width: 360px; margin: 80px auto; background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 24px; text-align: center; }
  #gate h1 { font-size: 16px; margin: 0 0 16px; }
  #gate input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
  #gate button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #4a6cf7; color: #fff; font-size: 14px; cursor: pointer; }
  .error-line { color: #d64545; font-size: 12px; margin-top: 10px; min-height: 14px; }
  /* --- main layout --- */
  #app { display: flex; height: calc(100vh - 49px); }
  #list-col { width: 340px; flex: none; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
  #tabs { display: flex; border-bottom: 1px solid #e0e0e0; }
  .tab { flex: 1; padding: 12px; text-align: center; font-size: 13px; cursor: pointer; color: #666; border-bottom: 2px solid transparent; }
  .tab.active { color: #1a1a2e; font-weight: 600; border-bottom-color: #4a6cf7; }
  #list { flex: 1; overflow-y: auto; }
  #empty-state { padding: 24px; text-align: center; color: #888; font-size: 13px; }
  .row { padding: 12px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
  .row:hover { background: #f7f8fc; }
  .row.selected { background: #eef1ff; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .row-contact { font-weight: 600; font-size: 13px; }
  .row-time { font-size: 11px; color: #999; flex: none; }
  .row-chip { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 999px; background: #e0e0e0; color: #555; margin-top: 4px; }
  .row-handoff { font-size: 12px; color: #555; margin-top: 4px; }
  #conv-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #conv-empty { margin: auto; color: #888; font-size: 14px; }
  #brief { background: #fff8e0; border-bottom: 1px solid #f0dfa0; padding: 12px 16px; font-size: 13px; }
  #brief b { color: #7a5c00; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
  .bubble.user { align-self: flex-start; background: #ffffff; color: #1a1a1a; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .bubble.assistant { align-self: flex-end; background: #dfe3f5; color: #444; border-bottom-right-radius: 4px; }
  .bubble.human_operator { align-self: flex-end; background: #4a6cf7; color: #fff; border-bottom-right-radius: 4px; }
  .bubble .label { display: block; font-size: 10px; opacity: 0.75; margin-bottom: 2px; }
  .chip { align-self: center; background: #e0e0e0; color: #555; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
  .media-thumb { display: block; max-width: 240px; max-height: 240px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
  .media-caption { display: block; }
  audio.media-audio { display: block; max-width: 240px; }
  .media-transcript { display: block; margin-top: 4px; }
  #actions { flex: none; border-top: 1px solid #e0e0e0; padding: 10px 16px; background: #fff; }
  #actions textarea { width: 100%; resize: none; padding: 8px 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; font-family: inherit; min-height: 44px; }
  #action-buttons { display: flex; gap: 8px; margin-top: 8px; }
  #action-buttons button { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
  #send-btn { background: #4a6cf7; color: #fff; }
  #resume-btn { background: #2fa86b; color: #fff; }
  #close-btn { background: #999; color: #fff; }
  #assumir-btn { background: #d67b1c; color: #fff; }
  #action-buttons button:disabled { opacity: 0.6; cursor: not-allowed; }
  #action-error { color: #d64545; font-size: 12px; padding: 6px 16px 0; min-height: 14px; }
  .line-header { display: flex; justify-content: space-between; padding: 8px 14px; background: #f2f3f5; border-bottom: 1px solid #e0e0e0; font-size: 12px; font-weight: 600; color: #444; }
  .line-empty { padding: 10px 14px; font-size: 12px; color: #999; border-bottom: 1px solid #eee; }
  .claim-btn { margin-top: 6px; padding: 5px 12px; border: none; border-radius: 6px; background: #d67b1c; color: #fff; font-size: 12px; cursor: pointer; }
  .claim-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  #list-error { padding: 0 14px; }
  #pane-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  #category-select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
  #release-btn { padding: 6px 12px; border: none; border-radius: 8px; background: #999; color: #fff; font-size: 13px; cursor: pointer; }
  #release-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  #notice { padding: 16px; color: #555; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div id="gate">
  <h1>Acme — Operador</h1>
  <input id="gate-input" type="text" placeholder="Chave da API do tenant" />
  <button id="gate-btn">Entrar</button>
  <div id="gate-error" class="error-line"></div>
</div>

<div id="app" style="display:none">
  <header>
    Acme — Operador
    <span class="header-right">
      <input id="operator-id" type="text" placeholder="Seu nome" maxlength="200" />
      <a id="logout-link">Sair</a>
    </span>
  </header>
  <div id="app-body" style="display:flex; height:calc(100% - 49px);">
    <div id="list-col">
      <div id="tabs">
        <div class="tab active" data-tab="inbox">Filas</div>
        <div class="tab" data-tab="minhas">Minhas</div>
        <div class="tab" data-tab="ativas">Ativas</div>
      </div>
      <div id="list-error" class="error-line"></div>
      <div id="list"></div>
      <div id="empty-state" style="display:none">Nenhuma conversa aguardando</div>
    </div>
    <div id="conv-col">
      <div id="conv-empty">Selecione uma conversa</div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const GATE_KEY = "harness_operator_api_key";
  const OPERATOR_KEY = "harness_operator_id";
  const DEFAULT_OPERATOR = "operador-demo";
  const TABS = {
    inbox: { states: ["HUMAN_HANDOFF"], lines: true },
    minhas: { states: ["HUMAN_HANDOFF"], mine: true },
    ativas: { states: ["ACTIVE_AI", "WAITING"] },
  };
  const STATE_LABEL = {
    ACTIVE_AI: "IA ativa",
    WAITING: "Aguardando",
    HUMAN_HANDOFF: "Com atendente",
    CLOSED: "Encerrada",
  };
  const REQUESTED_BY_LABEL = {
    user: "cliente",
    operator: "operador",
    system: "sistema",
    agent: "agente",
  };

  const gateEl = document.getElementById("gate");
  const gateInput = document.getElementById("gate-input");
  const gateBtn = document.getElementById("gate-btn");
  const gateError = document.getElementById("gate-error");
  const appEl = document.getElementById("app");
  const logoutLink = document.getElementById("logout-link");
  const listEl = document.getElementById("list");
  const emptyStateEl = document.getElementById("empty-state");
  const convColEl = document.getElementById("conv-col");
  const listErrorEl = document.getElementById("list-error");
  const operatorInput = document.getElementById("operator-id");
  const tabEls = document.querySelectorAll(".tab");

  // Demo mode only: the server hands out a key at /chat/bootstrap; elsewhere it is 404.
  fetch("/chat/bootstrap", { method: "POST" })
    .then(async (res) => {
      if (!res.ok) return;
      const body = await res.json();
      if (!gateInput.value && body && body.api_key) gateInput.value = body.api_key;
    })
    .catch(() => {});

  operatorInput.value = localStorage.getItem(OPERATOR_KEY) || DEFAULT_OPERATOR;

  function operatorId() {
    return operatorInput.value.trim() || DEFAULT_OPERATOR;
  }

  // The API's error body is {"error": {"message": ...}}.
  const API_MESSAGES_PT = {
    "conversation is already claimed": "Esta conversa já está com outro atendente.",
    "conversation is not waiting for an operator": "Esta conversa não está aguardando atendimento.",
    "conversation is not claimed": "Esta conversa não está com nenhum atendente.",
  };
  function apiMessage(data, fallback) {
    const message = data && data.error && data.error.message;
    if (!message) return fallback;
    return API_MESSAGES_PT[message] || message;
  }

  let apiKey = null;
  let activeTab = "inbox";
  let lastListJson = "";
  let selectedId = null;
  let selectedConversation = null;
  let lastMessagesJson = "";
  let listTimer = null;
  let waitTimer = null;
  let listSeq = 0;
  let paneOperator = null; // operator id the pane was rendered for
  let messagesTimer = null;
  let sending = false;

  // Object URLs for fetched media, cached once per message id — <img>/
  // <audio> can't set request headers, so we fetch the bytes ourselves and
  // hand the browser a blob: URL instead.
  const mediaUrlCache = new Map();

  async function getMediaObjectUrl(message) {
    if (mediaUrlCache.has(message.id)) return mediaUrlCache.get(message.id);
    try {
      const res = await fetch(message.media_url, { headers: { "X-API-Key": apiKey } });
      if (!res.ok) return null;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      mediaUrlCache.set(message.id, url);
      return url;
    } catch (err) {
      return null;
    }
  }

  function renderMediaBubble(m, el) {
    if (m.type === "image") {
      const img = document.createElement("img");
      img.className = "media-thumb";
      img.alt = "imagem enviada";
      img.addEventListener("click", () => {
        if (img.dataset.fullUrl) window.open(img.dataset.fullUrl, "_blank");
      });
      el.appendChild(img);
      if (m.content) {
        const caption = document.createElement("span");
        caption.className = "media-caption";
        caption.textContent = m.content;
        el.appendChild(caption);
      }
      getMediaObjectUrl(m).then((url) => {
        if (url) {
          img.src = url;
          img.dataset.fullUrl = url;
        }
      });
    } else if (m.type === "audio") {
      const audio = document.createElement("audio");
      audio.className = "media-audio";
      audio.controls = true;
      el.appendChild(audio);
      const transcript = document.createElement("span");
      transcript.className = "media-transcript";
      transcript.textContent = m.content;
      el.appendChild(transcript);
      getMediaObjectUrl(m).then((url) => {
        if (url) audio.src = url;
      });
    }
  }

  function showGate(errorText) {
    stopTimers();
    appEl.style.display = "none";
    gateEl.style.display = "block";
    gateError.textContent = errorText || "";
  }

  function stopTimers() {
    if (listTimer) clearInterval(listTimer);
    if (messagesTimer) clearInterval(messagesTimer);
    if (waitTimer) clearInterval(waitTimer);
    listTimer = null;
    messagesTimer = null;
    waitTimer = null;
  }

  async function apiFetch(path, options) {
    const opts = options || {};
    opts.headers = Object.assign({ "X-API-Key": apiKey }, opts.headers || {});
    let res;
    try {
      res = await fetch(path, opts);
    } catch (err) {
      return { ok: false, network: true };
    }
    if (res.status === 401 || res.status === 403) {
      localStorage.removeItem(GATE_KEY);
      showGate("Chave inválida ou sem acesso.");
      return { ok: false, authFailed: true };
    }
    return res;
  }

  function relativeTime(iso) {
    if (!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return "agora";
    if (min < 60) return "há " + min + " min";
    const hours = Math.floor(min / 60);
    if (hours < 24) return "há " + hours + " h";
    return "há " + Math.floor(hours / 24) + " d";
  }

  function truncate(text, n) {
    if (!text) return "";
    return text.length > n ? text.slice(0, n) + "…" : text;
  }

  // Refresh the "aguardando ..." texts in place; rows are not rebuilt.
  function refreshWaitTimes() {
    for (const row of listEl.querySelectorAll(".row[data-waiting-since]")) {
      const time = row.querySelector(".row-time");
      if (time) time.textContent = "aguardando " + relativeTime(row.dataset.waitingSince);
    }
  }

  async function fetchList() {
    const tab = activeTab;
    const seq = ++listSeq;
    const params = new URLSearchParams();
    let path;
    if (TABS[tab].lines) {
      params.append("include_handoff", "true");
      path = "/lines?" + params.toString();
    } else {
      for (const s of TABS[tab].states) params.append("state", s);
      if (TABS[tab].mine) params.append("claimed_by", operatorId());
      params.append("include_handoff", "true");
      params.append("limit", "100");
      path = "/conversations?" + params.toString();
    }
    const res = await apiFetch(path);
    if (!res.ok) return;
    const data = await res.json();
    if (seq !== listSeq) return; // a newer list request superseded this one
    if (tab !== activeTab) return; // the tab changed while the request was in flight
    const json = JSON.stringify(data);
    if (json === lastListJson) {
      refreshWaitTimes();
      return;
    }
    lastListJson = json;
    if (TABS[tab].lines) renderLines(data);
    else renderList(data);
  }

  function buildRow(c, withHandoff, withClaim) {
    const row = document.createElement("div");
    row.className = "row" + (c.id === selectedId ? " selected" : "");
    row.dataset.id = c.id;
    if (withClaim && c.waiting_since) row.dataset.waitingSince = c.waiting_since;
    const top = document.createElement("div");
    top.className = "row-top";
    const contact = document.createElement("span");
    contact.className = "row-contact";
    contact.textContent = c.contact_display_name || c.contact_external_user_id || c.id;
    const time = document.createElement("span");
    time.className = "row-time";
    time.textContent = withClaim
      ? "aguardando " + relativeTime(c.waiting_since)
      : relativeTime(c.last_message_at);
    top.appendChild(contact);
    top.appendChild(time);
    row.appendChild(top);
    if (!withClaim) {
      const chip = document.createElement("span");
      chip.className = "row-chip";
      chip.textContent = STATE_LABEL[c.state] || c.state;
      row.appendChild(chip);
    }
    if (withHandoff && c.latest_handoff) {
      const by = REQUESTED_BY_LABEL[c.latest_handoff.requested_by] || c.latest_handoff.requested_by;
      const handoff = document.createElement("div");
      handoff.className = "row-handoff";
      handoff.textContent = by + ": " + truncate(c.latest_handoff.reason || "", 60);
      row.appendChild(handoff);
    }
    if (withClaim) {
      const btn = document.createElement("button");
      btn.className = "claim-btn";
      btn.textContent = "Atender";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        claim(c, btn);
      });
      row.appendChild(btn);
    }
    row.addEventListener("click", () => selectConversation(c));
    return row;
  }

  function renderList(conversations) {
    listEl.innerHTML = "";
    emptyStateEl.textContent =
      activeTab === "minhas" ? "Nenhuma conversa sua" : "Nenhuma conversa aguardando";
    emptyStateEl.style.display = conversations.length === 0 ? "block" : "none";
    for (const c of conversations) {
      listEl.appendChild(buildRow(c, activeTab !== "ativas", false));
    }
  }

  function renderLines(lines) {
    listEl.innerHTML = "";
    emptyStateEl.style.display = "none";
    for (const line of lines) {
      const header = document.createElement("div");
      header.className = "line-header";
      const name = document.createElement("span");
      name.textContent = line.category_name || "Sem categoria";
      const count = document.createElement("span");
      count.textContent = String(line.conversations.length);
      header.appendChild(name);
      header.appendChild(count);
      listEl.appendChild(header);
      if (line.conversations.length === 0) {
        const empty = document.createElement("div");
        empty.className = "line-empty";
        empty.textContent = "Ninguém aguardando";
        listEl.appendChild(empty);
      }
      for (const c of line.conversations) {
        listEl.appendChild(buildRow(c, true, true));
      }
    }
  }

  function clearPane() {
    if (messagesTimer) clearInterval(messagesTimer);
    messagesTimer = null;
    selectedId = null;
    selectedConversation = null;
    convColEl.innerHTML = '<div id="conv-empty">Selecione uma conversa</div>';
  }

  async function claim(c, btn) {
    listErrorEl.textContent = "";
    btn.disabled = true;
    const res = await apiFetch("/conversations/" + c.id + "/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ operator_id: operatorId() }),
    });
    if (res.ok) {
      const conversation = await res.json();
      conversation.latest_handoff = conversation.latest_handoff || c.latest_handoff;
      switchTab("minhas");
      selectConversation(conversation);
    } else if (res.authFailed) {
      // gate already shown
    } else if (res.network) {
      btn.disabled = false;
      listErrorEl.textContent = "Falha de rede. Tente novamente.";
    } else {
      const data = await res.json().catch(() => ({}));
      listErrorEl.textContent = apiMessage(data, "Não foi possível atender a conversa.");
      lastListJson = "";
      fetchList();
    }
  }

  function switchTab(tab) {
    activeTab = tab;
    lastListJson = "";
    listErrorEl.textContent = "";
    tabEls.forEach((el) => el.classList.toggle("active", el.dataset.tab === tab));
    fetchList();
  }

  function selectConversation(conversation) {
    selectedId = conversation.id;
    selectedConversation = conversation;
    lastListJson = ""; // force re-render so the row highlight updates
    lastMessagesJson = "";
    renderConversationPane();
    fetchMessages();
    if (messagesTimer) clearInterval(messagesTimer);
    messagesTimer = setInterval(fetchMessages, 1500);
  }

  function renderConversationPane() {
    const c = selectedConversation;
    const isHandoff = c.state === "HUMAN_HANDOFF";
    const isMine = isHandoff && c.claimed_by === operatorId();
    paneOperator = operatorId();
    let actionsHtml;
    if (isMine) {
      actionsHtml =
        '<div id="actions">' +
        '<div id="pane-tools"></div>' +
        '<textarea id="reply-input" placeholder="Responder ao cliente…"></textarea>' +
        '<div id="action-error"></div>' +
        '<div id="action-buttons">' +
        '<button id="send-btn">Enviar</button>' +
        '<button id="resume-btn">Resumir</button>' +
        '<button id="close-btn">Fechar</button>' +
        "</div></div>";
    } else if (isHandoff) {
      actionsHtml =
        '<div id="actions">' +
        '<div id="pane-tools"></div>' +
        '<div id="action-error"></div>' +
        '<div id="action-buttons"></div></div>';
    } else {
      actionsHtml =
        '<div id="actions"><div id="action-error"></div><div id="action-buttons">' +
        '<button id="assumir-btn">Assumir</button>' +
        "</div></div>";
    }
    convColEl.innerHTML = '<div id="messages"></div>' + actionsHtml;
    if (c.latest_handoff) {
      const by = REQUESTED_BY_LABEL[c.latest_handoff.requested_by] || c.latest_handoff.requested_by;
      const brief = document.createElement("div");
      brief.id = "brief";
      const bold = document.createElement("b");
      bold.textContent = "Handoff solicitado por " + by;
      brief.appendChild(bold);
      if (c.latest_handoff.reason) {
        brief.appendChild(document.createTextNode(" — " + c.latest_handoff.reason));
      }
      brief.appendChild(document.createElement("br"));
      brief.appendChild(
        document.createTextNode(c.latest_handoff.summary || "Resumo indisponível")
      );
      convColEl.prepend(brief);
    }

    if (isMine) {
      buildPaneTools(c, true);
      const input = document.getElementById("reply-input");
      document.getElementById("send-btn").addEventListener("click", sendReply);
      document.getElementById("resume-btn").addEventListener("click", () => transition("resume"));
      document.getElementById("close-btn").addEventListener("click", () => transition("close"));
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendReply();
        }
      });
    } else if (isHandoff) {
      buildPaneTools(c, false);
      const buttons = document.getElementById("action-buttons");
      if (c.claimed_by) {
        const note = document.createElement("div");
        note.id = "claimed-note";
        note.textContent = "Em atendimento por " + c.claimed_by;
        buttons.appendChild(note);
      } else {
        const btn = document.createElement("button");
        btn.id = "pane-claim-btn";
        btn.className = "claim-btn";
        btn.textContent = "Atender";
        btn.addEventListener("click", () => claim(selectedConversation, btn));
        buttons.appendChild(btn);
      }
    } else {
      document.getElementById("assumir-btn").addEventListener("click", assumir);
    }
  }

  function buildPaneTools(c, mine) {
    const tools = document.getElementById("pane-tools");
    const select = document.createElement("select");
    select.id = "category-select";
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "Sem categoria";
    select.appendChild(none);
    select.value = "";
    tools.appendChild(select);
    const forId = c.id;
    apiFetch("/categories").then(async (res) => {
      if (!res.ok) return;
      const categories = await res.json();
      if (selectedId !== forId) return;
      for (const cat of categories) {
        const opt = document.createElement("option");
        opt.value = cat.id;
        opt.textContent = cat.name;
        select.appendChild(opt);
      }
      select.value = selectedConversation.category_id || "";
    });
    select.addEventListener("change", () => moveCategory(select));
    if (mine) {
      const btn = document.createElement("button");
      btn.id = "release-btn";
      btn.textContent = "Devolver à fila";
      btn.addEventListener("click", () => release(btn));
      tools.appendChild(btn);
    }
  }

  async function moveCategory(select) {
    showActionError("");
    const previous = selectedConversation.category_id || "";
    const forId = selectedId;
    const res = await apiFetch("/conversations/" + forId + "/category", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category_id: select.value || null }),
    });
    if (selectedId !== forId) return;
    if (res.ok) {
      const conversation = await res.json();
      conversation.latest_handoff =
        conversation.latest_handoff || selectedConversation.latest_handoff;
      selectedConversation = conversation;
      lastListJson = "";
      fetchList();
      return;
    }
    select.value = previous;
    if (res.authFailed) return;
    if (res.network) {
      showActionError("Falha de rede. Tente novamente.");
    } else {
      const data = await res.json().catch(() => ({}));
      showActionError(apiMessage(data, "Não foi possível mover a conversa."));
    }
  }

  async function release(btn) {
    showActionError("");
    btn.disabled = true;
    const res = await apiFetch("/conversations/" + selectedId + "/release", { method: "POST" });
    if (res.ok) {
      switchTab("inbox");
      clearPane();
      return;
    }
    btn.disabled = false;
    if (res.authFailed) return;
    if (res.network) {
      showActionError("Falha de rede. Tente novamente.");
    } else {
      const data = await res.json().catch(() => ({}));
      showActionError(apiMessage(data, "Não foi possível devolver a conversa."));
    }
  }

  function showActionError(text) {
    const el = document.getElementById("action-error");
    if (el) el.textContent = text || "";
  }

  async function fetchMessages() {
    if (!selectedId) return;
    const res = await apiFetch("/conversations/" + selectedId + "/messages");
    if (!res.ok) return;
    const messages = await res.json();
    const json = JSON.stringify(messages);
    if (json === lastMessagesJson) return;
    lastMessagesJson = json;
    renderMessages(messages);
  }

  function renderMessages(messages) {
    const el = document.getElementById("messages");
    if (!el) return;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 20;
    el.innerHTML = "";
    for (const m of messages) {
      const bubble = document.createElement("div");
      if (m.type === "unsupported") {
        bubble.className = "chip";
        bubble.textContent = m.content;
      } else if (m.role === "user") {
        bubble.className = "bubble user";
        if (m.type === "image" || m.type === "audio") {
          renderMediaBubble(m, bubble);
        } else {
          bubble.textContent = m.content;
        }
      } else if (m.role === "assistant") {
        bubble.className = "bubble assistant";
        bubble.textContent = m.content;
      } else if (m.role === "human_operator") {
        bubble.className = "bubble human_operator";
        bubble.innerHTML = '<span class="label">Você</span>';
        bubble.appendChild(document.createTextNode(m.content));
      } else {
        bubble.className = "chip";
        bubble.textContent = (m.role || "system") + ": " + m.content;
      }
      el.appendChild(bubble);
    }
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  async function sendReply() {
    if (sending) return;
    const input = document.getElementById("reply-input");
    const text = input.value.trim();
    if (!text) return;
    sending = true;
    document.getElementById("send-btn").disabled = true;
    showActionError("");
    const res = await apiFetch("/conversations/" + selectedId + "/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text }),
    });
    if (res.ok) {
      input.value = "";
      lastMessagesJson = "";
      await fetchMessages();
    } else if (res.authFailed) {
      // gate already shown
    } else if (res.network) {
      showActionError("Falha de rede. Tente novamente.");
    } else {
      const data = await res.json().catch(() => ({}));
      showActionError(res.status === 409 ? apiMessage(data, "Não foi possível enviar a mensagem.") : "Não foi possível enviar a mensagem.");
    }
    sending = false;
    const btn = document.getElementById("send-btn");
    if (btn) btn.disabled = false;
  }

  async function transition(kind) {
    showActionError("");
    const res = await apiFetch("/conversations/" + selectedId + "/" + kind, { method: "POST" });
    if (res.ok) {
      if (messagesTimer) clearInterval(messagesTimer);
      messagesTimer = null;
      selectedId = null;
      selectedConversation = null;
      convColEl.innerHTML =
        '<div id="notice">' +
        (kind === "resume" ? "Conversa devolvida à IA." : "Conversa encerrada.") +
        "</div>";
      lastListJson = "";
      fetchList();
    } else if (res.authFailed) {
      // gate already shown
    } else if (res.network) {
      showActionError("Falha de rede. Tente novamente.");
    } else {
      const data = await res.json().catch(() => ({}));
      showActionError(res.status === 409 ? apiMessage(data, "Não foi possível concluir a ação.") : "Não foi possível concluir a ação.");
    }
  }

  async function assumir() {
    showActionError("");
    const res = await apiFetch("/conversations/" + selectedId + "/handoff", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reason: "assumido pelo operador" }),
    });
    if (res.ok) {
      const handedOff = await res.json();
      const claimRes = await apiFetch("/conversations/" + handedOff.id + "/claim", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ operator_id: operatorId() }),
      });
      if (claimRes.ok) {
        const conversation = await claimRes.json();
        conversation.latest_handoff = conversation.latest_handoff || handedOff.latest_handoff;
        switchTab("minhas");
        selectConversation(conversation);
      } else if (claimRes.authFailed) {
        // gate already shown
      } else {
        let text = "Falha de rede. Tente novamente.";
        if (!claimRes.network) {
          const data = await claimRes.json().catch(() => ({}));
          text = apiMessage(data, "Não foi possível atender a conversa.");
        }
        clearPane();
        switchTab("inbox");
        listErrorEl.textContent = text;
      }
    } else if (res.authFailed) {
      // gate already shown
    } else if (res.network) {
      showActionError("Falha de rede. Tente novamente.");
    } else {
      const data = await res.json().catch(() => ({}));
      showActionError(res.status === 409 ? apiMessage(data, "Não foi possível assumir a conversa.") : "Não foi possível assumir a conversa.");
    }
  }

  function start() {
    gateEl.style.display = "none";
    appEl.style.display = "block";
    lastListJson = "";
    fetchList();
    if (listTimer) clearInterval(listTimer);
    listTimer = setInterval(fetchList, 3000);
    if (waitTimer) clearInterval(waitTimer);
    waitTimer = setInterval(refreshWaitTimes, 30000);
  }

  gateBtn.addEventListener("click", () => {
    const key = gateInput.value.trim();
    if (!key) return;
    localStorage.setItem(GATE_KEY, key);
    apiKey = key;
    start();
  });

  logoutLink.addEventListener("click", () => {
    localStorage.removeItem(GATE_KEY);
    location.reload();
  });

  operatorInput.addEventListener("input", () => {
    localStorage.setItem(OPERATOR_KEY, operatorInput.value.trim());
    if (selectedConversation && paneOperator !== operatorId()) {
      renderConversationPane();
      lastMessagesJson = "";
      fetchMessages();
    }
    if (activeTab === "minhas") {
      lastListJson = "";
      fetchList();
    }
  });

  tabEls.forEach((el) => {
    el.addEventListener("click", () => {
      clearPane();
      switchTab(el.dataset.tab);
    });
  });

  const stored = localStorage.getItem(GATE_KEY);
  if (stored) {
    apiKey = stored;
    start();
  } else {
    showGate("");
  }
})();
</script>
</body>
</html>
