[project]
name = "parley"
version = "0.1.0"
description = "Headless, multi-tenant infrastructure for AI-powered conversational apps."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "redis>=5",
    "structlog>=24",
    "httpx>=0.27",
    "cryptography>=43",
    "jsonschema>=4.26.0",
    "python-multipart>=0.0.32",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "fakeredis>=2.24",
    "respx>=0.23.1",
    "mypy>=2.4.1",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-argument is the documented idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# test_engine is session-scoped; keep the event loop session-scoped too so
# its asyncpg connections aren't reused across different loops per test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["app.security.*", "app.queue.*", "app.conversations.*"]
# `strict = true` in an override leaks to every module in mypy 2.x, so the
# strict flags are spelled out; they are the per-module ones `--strict` enables.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
