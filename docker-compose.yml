services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harness}
      POSTGRES_DB: ${POSTGRES_DB:-harness}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-harness}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      # Inside the compose network, services reach each other by service
      # name, not by the host-mapped ports used in .env for local `uv run`.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:-harness}@postgres:5432/${POSTGRES_DB:-harness}
      REDIS_URL: redis://redis:6379/0
      # Allow tools to reach the demo's mocked business endpoint past the
      # SSRF guard (see app/tools/ssrf.py) — scripts/demo.py registers
      # `get_order` at http://mock-tools:9000/orders.
      TOOL_ALLOWED_HOSTS: mock-tools
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-tools:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:-harness}@postgres:5432/${POSTGRES_DB:-harness}
      REDIS_URL: redis://redis:6379/0
      TOOL_ALLOWED_HOSTS: mock-tools
    command: uv run python -m app.workers.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-tools:
        condition: service_started

  # Stands in for a customer's own business-logic endpoint (see
  # scripts/mock_tool_server.py and PRODUCT.md's success demo): a bare
  # `GET /orders?order_id=` the demo's `get_order` tool points at. No env
  # needed — it's just mounted into the same built image so it shares the
  # already-installed FastAPI/uvicorn deps, no separate Dockerfile.
  mock-tools:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./scripts:/srv/scripts:ro
    command: uv run uvicorn scripts.mock_tool_server:app --host 0.0.0.0 --port 9000

volumes:
  postgres_data:
