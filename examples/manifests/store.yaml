# Loja Aurora: an online shop. One agent that answers order questions, three
# departments, one tool that reads order status, one channel owned by the
# shop's own inbox.
#
# Before applying, set the secret the tool refers to:
#   PUT /secrets/store_orders_token   {"value": "<the shop's order API token>"}
#
# The external channel's signing secret is generated by parley and returned
# once, in `generated`, by the apply that creates the channel.
version: 1

agents:
  - key: atendimento
    name: Atendimento Loja Aurora
    model: gpt-4o-mini
    temperature: 0.3
    instructions: |
      Você é a Duda, atendente virtual da Loja Aurora, uma loja online de
      utilidades para a casa. Responda em português do Brasil, com frases
      curtas e um tom simpático.

      Quando o cliente perguntar sobre um pedido, peça o número do pedido,
      consulte o status com a ferramenta get_order_status e conte o que
      encontrou: situação, transportadora e previsão de entrega. Se a
      consulta falhar, diga que não conseguiu consultar agora e ofereça
      passar o caso para uma pessoa.

      Para dúvidas sobre produtos, preços e promoções, diga o que sabe e não
      invente: se não souber, ofereça passar para uma pessoa.
    tool_names:
      - get_order_status
    boundary_scope: >-
      Pedidos, entregas, trocas, devoluções, produtos e formas de pagamento
      da Loja Aurora.
    boundary_never:
      - Prometer reembolso, desconto ou prazo que não esteja na política da loja.
      - Pedir ou repetir número completo de cartão ou senha.
    boundary_refusal_message: >-
      Só consigo ajudar com assuntos da Loja Aurora. Posso passar você para
      uma pessoa da equipe se quiser.
    handoff_message: Vou chamar uma pessoa da nossa equipe para continuar com você.

departments:
  - name: Vendas
    description: >-
      Dúvidas antes da compra: produtos, estoque, preços, promoções, cupons
      e formas de pagamento.
  - name: Acompanhamento de pedidos
    description: >-
      Onde está o pedido, prazo de entrega, rastreio, endereço de entrega e
      atraso.
  - name: Suporte
    description: >-
      Depois da compra: produto com defeito, troca, devolução, reembolso e
      reclamações.

tools:
  - name: get_order_status
    description: >-
      Consulta um pedido da Loja Aurora pelo número e devolve a situação, a
      transportadora e a previsão de entrega.
    method: GET
    endpoint: https://api.example.com/v1/orders
    input_schema:
      type: object
      properties:
        order_id:
          type: string
          description: Número do pedido, como aparece no e-mail de confirmação.
      required:
        - order_id
    auth_config:
      type: bearer
      token:
        secret: store_orders_token
    timeout_seconds: 8

channels:
  - key: caixa-da-loja
    type: external
    name: Caixa de entrada da loja
    agent: atendimento
    config:
      events_url: https://inbox.example.com/parley/events
