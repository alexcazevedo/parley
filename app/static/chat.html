<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acme — Web Chat Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f2f3f5;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 600;
    flex: none;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: #4a6cf7;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: #ffffff;
    color: #1a1a1a;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
  }
  .chip {
    align-self: center;
    background: #e0e0e0;
    color: #555;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
  }
  #typing {
    align-self: flex-start;
    font-size: 13px;
    color: #888;
    padding: 4px 14px;
    font-style: italic;
    display: none;
  }
  #composer {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #fff;
    border-top: 1px solid #e0e0e0;
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  #input:focus {
    border-color: #4a6cf7;
  }
  #send {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #4a6cf7;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  #send:disabled {
    background: #a8b6f7;
    cursor: not-allowed;
  }
  #status {
    text-align: center;
    font-size: 12px;
    color: #888;
    padding: 6px;
  }
</style>
</head>
<body>
<header>Acme — Web Chat Demo</header>
<div id="status">Conectando…</div>
<div id="messages"></div>
<div id="typing">Agente está digitando…</div>
<div id="composer">
  <input id="input" type="text" placeholder="Digite sua mensagem…" autocomplete="off" disabled />
  <button id="send" disabled>Enviar</button>
</div>

<script>
(function () {
  "use strict";

  const messagesEl = document.getElementById("messages");
  const typingEl = document.getElementById("typing");
  const inputEl = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const statusEl = document.getElementById("status");

  let apiKey = null;
  let channelId = null;
  let conversationId = null;
  let userId = null;
  let pollTimer = null;
  let awaitingReply = false;
  let lastRenderedCount = 0;

  function getUserId() {
    let id = localStorage.getItem("acme_webchat_user_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("acme_webchat_user_id", id);
    }
    return id;
  }

  function renderMessages(messages) {
    messagesEl.innerHTML = "";
    for (const m of messages) {
      const el = document.createElement("div");
      if (m.role === "user") {
        el.className = "bubble user";
        el.textContent = m.content;
      } else if (m.role === "assistant") {
        el.className = "bubble assistant";
        el.textContent = m.content;
      } else {
        el.className = "chip";
        el.textContent = (m.role || "system") + ": " + m.content;
      }
      messagesEl.appendChild(el);
    }
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // Typing indicator: show while we're awaiting a reply and the last
    // rendered message is still the user's own message.
    const last = messages[messages.length - 1];
    if (awaitingReply && last && last.role === "user") {
      typingEl.style.display = "block";
    } else {
      typingEl.style.display = "none";
      awaitingReply = false;
    }
    lastRenderedCount = messages.length;
  }

  async function pollMessages() {
    if (!conversationId) return;
    try {
      const res = await fetch(`/conversations/${conversationId}/messages`, {
        headers: { "X-API-Key": apiKey },
      });
      if (!res.ok) return;
      const messages = await res.json();
      renderMessages(messages);
    } catch (err) {
      // Transient network error while polling — ignore, next tick retries.
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    sendEl.disabled = true;

    try {
      const res = await fetch("/channels/webchat/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-API-Key": apiKey,
        },
        body: JSON.stringify({
          channel_id: channelId,
          user_id: userId,
          message: text,
        }),
      });
      if (res.ok) {
        const data = await res.json();
        conversationId = data.conversation_id;
        awaitingReply = true;
      }
    } catch (err) {
      // Send failed — user can retry by typing again.
    } finally {
      sendEl.disabled = false;
      inputEl.focus();
    }
    await pollMessages();
  }

  async function bootstrap() {
    try {
      const res = await fetch("/chat/bootstrap", { method: "POST" });
      if (!res.ok) throw new Error("bootstrap failed");
      const data = await res.json();
      apiKey = data.api_key;
      channelId = data.channel_id;
      userId = getUserId();

      statusEl.textContent = "Conectado. Envie uma mensagem para começar.";
      inputEl.disabled = false;
      sendEl.disabled = false;
      inputEl.focus();

      pollTimer = setInterval(pollMessages, 1000);
    } catch (err) {
      statusEl.textContent = "Falha ao conectar. Recarregue a página.";
    }
  }

  sendEl.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }
  });

  bootstrap();
})();
</script>
</body>
</html>
